services:
  users-api:
    build:
      context: ./users-api
      dockerfile: Dockerfile
    container_name: users-api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DB_PATH=/app/data/users.db
    volumes:
      - users_data:/app/data
    restart: unless-stopped

  auth-api:
    build:
      context: ./auth-api
      dockerfile: Dockerfile
    container_name: auth-api
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - DB_PATH=/app/data/auth.db
    volumes:
      - auth_data:/app/data
    restart: unless-stopped

  orders-api:
    build:
      context: ./orders-api
      dockerfile: Dockerfile
    container_name: orders-api
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - DB_PATH=/app/data/orders.db
    volumes:
      - orders_data:/app/data
    restart: unless-stopped

  products-api:
    build:
      context: ./products-api
      dockerfile: Dockerfile
    container_name: products-api
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
      - DB_PATH=/app/data/products.db
    volumes:
      - products_data:/app/data
    restart: unless-stopped

volumes:
  users_data:
  auth_data:
  orders_data:
  products_data:
